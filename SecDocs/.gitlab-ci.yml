variables:
  IMAGE_VERSION: "${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}_${CI_COMMIT_TAG}"
  FULL_IMAGE_NAME: "${REGISTRY_HOST}/${REGISTRY_USER}/${IMAGE_VERSION}"
  CONTAINER_NAME: "${CI_PROJECT_NAME}"
  SAST_REPORT: "${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_${CI_COMMIT_TAG}_SAST.txt"
  IMAGE_SCAN_REPORT: "${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_${CI_COMMIT_TAG}_IMAGE_SCAN.txt"

stages:
  - sast
  - build
  - image_scan 
  - push 
  - deploy

sast:
  stage: sast
  variables:
    GIT_STRATEGY: clone
  script:
    - docker run --rm -v "$PWD:/scan" aquasec/trivy fs --scanners vuln,secret,misconfig /scan > ${SAST_REPORT}
  artifacts:
    paths:
      - ${SAST_REPORT}
    expire_in: 1 day

  tags:
    - secdocs-build-shell
  only:
    - tags


build:
  stage: build
  variables:
    GIT_STRATEGY: none 
  script:
    - docker build -t ${IMAGE_VERSION} .
  tags:
    - secdocs-build-shell
  only:
    - tags

image_scan:
  stage: image_scan
  variables:
    GIT_STRATEGY: none
  script:
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image ${IMAGE_VERSION} > ${IMAGE_SCAN_REPORT}
  artifacts:
    paths:
      - ${IMAGE_SCAN_REPORT}
    expire_in: 1 day

  tags:
    - secdocs-build-shell
  only:
    - tags


push:
  stage: push
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo ${REGISTRY_PASSWORD} | docker login ${REGISTRY_HOST} -u ${REGISTRY_USER} --password-stdin  
  script:
    - docker tag ${IMAGE_VERSION} ${FULL_IMAGE_NAME}
    - docker push ${FULL_IMAGE_NAME}
  after_script: 
    - docker logout ${REGISTRY_HOST}
  tags:
    - secdocs-build-shell
  only:
    - tags
  

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo ${REGISTRY_PASSWORD} | docker login ${REGISTRY_HOST} -u ${REGISTRY_USER} --password-stdin  

  script:
    - docker pull ${FULL_IMAGE_NAME}
    - docker rm -f ${CONTAINER_NAME} 2>/dev/null || true
    - docker run --name ${CONTAINER_NAME} -dp ${FE_PORT} ${FULL_IMAGE_NAME}
  after_script: 
    - docker logout ${REGISTRY_HOST}
  tags:
    - secdocs-dev-shell
  only:
    - tags